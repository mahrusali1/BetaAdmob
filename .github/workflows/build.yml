name: Build Extension

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repositori beserta submodule
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Setup Java JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. Jalankan skrip update-deps
      - name: Update Dependencies
        run: |
          chmod +x update-deps.sh
          ./update-deps.sh

      # 4. Jalankan Ant Build
      - name: Build Extension with Ant
        run: ant

      # 5. Upload hasil berkas .aix (Update v3 -> v4)
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaAdmob-extension
          path: out/*.aix
