name: Build BetaAdmob AIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download AdMob Libraries to lib/deps
      run: |
        mkdir -p lib/deps
        cd lib/deps

        wget -q https://repo1.maven.org/maven2/com/google/android/gms/play-services-ads-lite/22.6.0/play-services-ads-lite-22.6.0.aar -O ads-lite.zip
        unzip -o ads-lite.zip classes.jar
        mv classes.jar play-services-ads-lite.jar
        rm ads-lite.zip

        wget -q https://repo1.maven.org/maven2/com/google/android/gms/play-services-ads/22.6.0/play-services-ads-22.6.0.aar -O ads.zip
        unzip -o ads.zip classes.jar
        mv classes.jar play-services-ads.jar
        rm ads.zip

        wget -q https://repo1.maven.org/maven2/com/google/android/gms/play-services-basement/18.2.0/play-services-basement-18.2.0.aar -O basement.zip
        unzip -o basement.zip classes.jar
        mv classes.jar play-services-basement.jar
        rm basement.zip

        wget -q https://repo1.maven.org/maven2/com/google/android/gms/play-services-tasks/18.0.2/play-services-tasks-18.0.2.aar -O tasks.zip
        unzip -o tasks.zip classes.jar
        mv classes.jar play-services-tasks.jar
        rm tasks.zip

        wget -q https://repo1.maven.org/maven2/com/google/android/gms/play-services-ads-identifier/18.0.1/play-services-ads-identifier-18.0.1.aar -O id.zip
        unzip -o id.zip classes.jar
        mv classes.jar play-services-ads-identifier.jar
        rm id.zip

        cd ../..

    - name: Build Extension with ProGuard
      run: ant extensions -Dproguard=1

    - name: Upload AIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetaAdmob-Extension
        path: out/*.aix
